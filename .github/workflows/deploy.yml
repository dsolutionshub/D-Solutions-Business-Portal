# push to main → production. Order: CI → D1 migrations → API Worker. Migrations are
# backward-compatible (they only add tables, columns or rows), so the running Worker keeps working
# until the new one is live. The app itself is built and published by Netlify on the same push
# (netlify.toml), so it isn't deployed here.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The GitHub environment "production" holds the secrets; add a required reviewer there
    # if you want an approval step before production deploys.
    environment: production
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 1. Database migrations
        run: node scripts/deploy.mjs migrate --env "$TARGET"
      - name: 2. API Worker
        run: node scripts/deploy.mjs server --env "$TARGET"

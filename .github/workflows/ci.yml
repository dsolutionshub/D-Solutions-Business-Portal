# Every pull request (and every deploy, which calls this first): typecheck, lint, format,
# unit + API tests with coverage, build, bundle secret scan, end-to-end tests in a headless browser.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit + API tests (server with coverage)
        run: |
          npm run test -w shared
          npm run test -w client
          npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: server/coverage
          retention-days: 14
      - run: npm run build
      - name: No secrets in the browser bundle
        run: npm run check:bundle

      # End-to-end: local Worker + Vite with a freshly seeded throwaway database.
      - name: Local settings for the end-to-end run (throwaway key, never a real secret)
        run: |
          {
            echo "ENVIRONMENT=development"
            echo "DEV_USER_EMAIL=owner@e2e.test"
            echo "ENCRYPTION_KEY=$(node server/scripts/gen-key.mjs)"
            echo "BREVO_API_KEY="
            echo "APP_URL=http://127.0.0.1:5174"
          } > server/.dev.vars
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (journeys, 390px, dark mode, accessibility)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

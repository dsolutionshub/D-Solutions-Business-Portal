# Weekly (Monday 02:00 IST) and on demand: export the production D1 database, encrypt it with age
# for the public key in backup/age-recipient.txt, and keep it for 90 days as a workflow artifact
# (download older ones you want to keep). An unencrypted export is never uploaded (scripts/backup.mjs).
# Restore: docs/OPERATIONS.md → Restore.
name: Backup

on:
  schedule:
    - cron: '30 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export, count rows, encrypt
        id: backup
        run: node scripts/backup.mjs --env production --out out
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ steps.backup.outputs.stamp }}
          path: out/
          retention-days: 90
          if-no-files-found: error

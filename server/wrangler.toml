# Cloudflare Worker for the D Solutions Business Portal API.
#
#   local:       `npm run dev` (uses the top level below + server/.dev.vars)
#   production:  `npm run deploy:server:prod`        → [env.production]   (docs/DEPLOY.md)
#   staging:     `npm run deploy:server:staging`     → [env.staging]      (optional, not set up yet)
#
# Secrets are NOT set here. Per environment:
#   npx wrangler secret put ENCRYPTION_KEY --env production
#   npx wrangler secret put BREVO_API_KEY  --env production
# Everything marked REPLACE is filled in during docs/DEPLOY.md (npm run setup:prod prints the ids).

name = "dsol-portal-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# The top level is for `wrangler dev` only (its database_id is a placeholder, so a deploy without
# --env fails). workers_dev = false: no public *.workers.dev address for the API.
workers_dev = false

[vars]
ENVIRONMENT = "production"   # server/.dev.vars sets development locally
EMAIL_FROM_ADDRESS = "no-reply@example.com"
EMAIL_FROM_NAME = "D Solutions"
APP_URL = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "dsol-portal"
database_id = "00000000-0000-0000-0000-000000000000" # local dev ignores it
migrations_dir = "migrations"


[triggers]
# 02:30 UTC = 08:00 IST — daily reminder digests, client overdue reminders, scheduled emails.
# Every 15 minutes — send scheduled emails whose time has come (nothing else).
crons = ["30 2 * * *", "*/15 * * * *"]

[observability]
enabled = true

# ───────────────────────────────────────────────────────────── staging ──
[env.staging]
name = "dsol-portal-api-staging"
workers_dev = false
# The API lives on the same origin as the app: staging.<your-domain>/api/* → this Worker,
# everything else → the Pages project. One Cloudflare Access application covers both.
routes = [{ pattern = "staging.example.com/api/*", zone_name = "example.com" }] # REPLACE domain

[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://staging.example.com"                     # REPLACE
# Optional: only if Cloudflare Access sits in front (docs/DEPLOY.md step 7). Empty = portal passwords only.
ACCESS_TEAM_DOMAIN = ""   # e.g. "your-team.cloudflareaccess.com"
ACCESS_AUD = ""           # the staging Access application's AUD tag
EMAIL_FROM_ADDRESS = "no-reply@example.com"                 # REPLACE (a sender verified in Brevo)
EMAIL_FROM_NAME = "D Solutions (staging)"
CORS_ORIGINS = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "dsol-portal-staging"
database_id = "REPLACE-with-staging-database-id"
migrations_dir = "migrations"


[env.staging.triggers]
crons = ["30 2 * * *", "*/15 * * * *"]

[env.staging.observability]
enabled = true

# ────────────────────────────────────────────────────────── production ──
[env.production]
name = "dsol-portal-api"
# The app is on Netlify, which forwards /api/* to this Worker's workers.dev address
# (netlify.toml). Everything except /api/health and the signed /api/public links needs a sign-in.
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
# The Netlify site's address (DEPLOY.md step 8), e.g. "https://dsol-portal.netlify.app"
APP_URL = "https://dsolutions-business-portal.netlify.app"
# Optional: only if Cloudflare Access sits in front. Empty = portal passwords only.
ACCESS_TEAM_DOMAIN = ""   # e.g. "your-team.cloudflareaccess.com"
ACCESS_AUD = ""           # the production Access application's AUD tag
EMAIL_FROM_ADDRESS = "dsolutionshub@gmail.com"   # verified sender in Brevo
EMAIL_FROM_NAME = "D Solutions"
CORS_ORIGINS = ""
# Workers FREE plan: 10 ms CPU per request, so sign-in hashing uses 20,000 rounds (~4 ms).
# On Workers Paid, delete this line (default 100,000); passwords re-hash at next sign-in.
PBKDF2_ITERATIONS = "20000"

[[env.production.d1_databases]]
binding = "DB"
database_name = "dsol-portal-prod"
database_id = "ac56387a-763f-4872-9d67-d387b8d1af89"
migrations_dir = "migrations"


[env.production.triggers]
crons = ["30 2 * * *", "*/15 * * * *"]

[env.production.observability]
enabled = true
